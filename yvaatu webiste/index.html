<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TweakHub - Home</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between">

    <!-- Navigation / Header -->
    <header class="p-6 flex justify-between items-center max-w-7xl mx-auto w-full">
        <div id="tweakhub" class="text-xl font-black tracking-wider text-white">TWEAKHUB</div>
        <a href="yvaatupage2.html" class="text-gray-400 hover:text-white transition text-sm font-medium">Zu den Paketen &rarr;</a>
    </header>

    <!-- Hauptinhalt: "Still in work" Box im selben Style -->
    <main class="max-w-3xl mx-auto px-6 py-20 w-full flex-1 flex items-center justify-center">
        <div class="w-full bg-gray-900/50 border border-white/10 p-10 lg:p-12 rounded-3xl backdrop-blur-sm text-center transition-all duration-300 hover:bg-gray-900/80 hover:border-2 hover:border-[#5865F2] hover:shadow-[0_0_30px_rgba(88,101,242,0.2)]">
            
            <!-- Badge -->
            <div class="inline-block bg-[#5865F2]/20 text-[#5865F2] border border-[#5865F2]/30 px-4 py-1.5 rounded-full text-xs font-bold tracking-wide mb-6">
                STATUS: IN DEVELOPMENT
            </div>

            <h1 class="text-4xl lg:text-5xl font-black tracking-tight mb-4">
                This website is <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#5865F2] to-purple-400">still in work</span>
            </h1>
            
            <p class="text-gray-400 text-base max-w-lg mx-auto mb-8 leading-relaxed">
                Wir arbeiten mit Hochdruck daran, dir das beste Optimierungs-Erlebnis zu bieten. Schau dir in der Zwischenzeit gerne unsere verfügbaren Pakete an!
            </p>

            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <a href="yvaatupage2.html" class="bg-[#5865F2] hover:bg-[#4752C4] text-white font-bold py-4 px-8 rounded-xl transition duration-300 shadow-lg shadow-[#5865F2]/30 text-center">
                    Zu den Paketen
                </a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-8 text-gray-600 text-xs">
        &copy; 2026 TweakHub. Alle Rechte vorbehalten.
    </footer>

</body>
</html>
